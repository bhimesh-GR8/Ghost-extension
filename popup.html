<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Ghost Extension</title>
</head>
<body>
    <h1>Ghost Extension</h1>
    <label><input type="checkbox" data-setting="thumbnails"> Scary thumbnails</label>

    <button id="reset">Reset</button>

    <script src="popup.js"></script>
</body>
</html>
